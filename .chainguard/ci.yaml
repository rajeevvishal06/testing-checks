version: 1
environment:
  packages: [python-3.13, py3.13-pip]
  vars:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    TMPDIR: /var/tmp
checks:
  # Kept from Scenario 1: a PR can't remove a check that main already runs.
  hello:
    cmd: ls -la

  lint:
    description: Ruff lint, reported as inline annotations on the PR.
    script: |
      python3 -m venv /var/tmp/venv
      . /var/tmp/venv/bin/activate
      pip install --quiet ruff
      ruff check --output-format=github . > /var/tmp/ruff.out && status=0 || status=$?
      sed 's#file=/work/#file=#' /var/tmp/ruff.out
      exit $status
    timeout: 10m
    network:
      egress: [pypi.org, files.pythonhosted.org]

  test:
    description: Unit tests with pytest.
    script: |
      python3 -m venv /var/tmp/venv
      . /var/tmp/venv/bin/activate
      pip install --quiet -r requirements.txt
      pytest -q
    timeout: 10m
    network:
      egress: [pypi.org, files.pythonhosted.org]

  supply-chain-sim:
    description: Simulates a malicious dependency calling home. It is not on the allowlist.
    script: |
      python3 scripts/phone_home.py
    network:
      egress: [pypi.org]
      policy: destroy
